server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name proforin.online www.proforin.online proforin.ru www.proforin.ru 2.26.96.99 _;

    access_log /var/log/nginx/kliko-maintenance.access.log;
    error_log /var/log/nginx/kliko-maintenance.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name proforin.online www.proforin.online proforin.ru www.proforin.ru;

    ssl_certificate /etc/letsencrypt/live/proforin.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proforin.online/privkey.pem;
    ssl_session_cache shared:KlikoSSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /srv/kliko-maintenance/current;
    index index.html;
    etag on;

    access_log /var/log/nginx/kliko-maintenance.ssl.access.log;
    error_log /var/log/nginx/kliko-maintenance.ssl.error.log warn;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'none'; style-src 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ~ /\. {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }
}
